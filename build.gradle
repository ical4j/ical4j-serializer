buildscript {
    // The axion-release plugin (at its latest, 1.21.2) pulls Bouncy Castle 1.81/1.82 onto the
    // plugin classpath, below the 1.84 that fixes GHSA-p93r-85wp-75v3, -cj8j-37rh-8475,
    // -c3fc-8qff-9hwx and -wg6q-6289-32hp. Force the patched version until axion-release ships it.
    // Build-time only; not part of the published artifact.
    configurations.classpath {
        resolutionStrategy {
            force 'org.bouncycastle:bcprov-jdk18on:1.84',
                    'org.bouncycastle:bcpg-jdk18on:1.84',
                    'org.bouncycastle:bcpkix-jdk18on:1.84',
                    'org.bouncycastle:bcutil-jdk18on:1.84'
        }
    }
}

plugins {
    id 'groovy'
    id "biz.aQute.bnd.builder" version "7.1.0"
    id 'java-library'
    id 'com.vanniktech.maven.publish' version '0.34.0'
    id 'pl.allegro.tech.build.axion-release' version '1.20.1'
}

repositories {
    mavenCentral()
    mavenLocal()
    // sonatype snapshots
    maven {
        url 'https://central.sonatype.com/repository/maven-snapshots/'
    }
}

java {
    // bnd 7.x requires JDK 17 to run; Gradle's toolchain transparently provisions
    // a JDK 17 even when the build is launched with an older runtime.
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    sourceCompatibility = 11
    targetCompatibility = 11
}

dependencies {
    api libs.ical4j, libs.ical4j.vcard, libs.ical4j.extensions,
            libs.jackson.databind, libs.jackson.dataformat.xml

    implementation libs.j2html

    annotationProcessor 'org.osgi:osgi.core:8.0.0',
            'org.osgi:org.osgi.service.component.annotations:1.5.1',
            'org.osgi:org.osgi.service.metatype.annotations:1.4.1',
            'org.osgi:org.osgi.annotation:6.0.0'

    testImplementation libs.groovy

    testImplementation platform(libs.spock.bom), libs.spock.core, libs.log4j.core, libs.log4j.slf4j2


}

test {
    useJUnitPlatform()
}

javadoc {
    options {
        links 'https://docs.oracle.com/en/java/javase/11/docs/api/',
            'https://javadoc.io/doc/org.mnode.ical4j/ical4j/latest',
            'https://javadoc.io/doc/org.mnode.ical4j/ical4j-vcard/latest',
            'https://javadoc.io/doc/org.mnode.ical4j/ical4j-extensions/latest',
            'https://javadoc.io/doc/com.fasterxml.jackson.core/jackson-core/latest',
            'https://javadoc.io/doc/com.fasterxml.jackson.core/jackson-databind/latest',
            'https://javadoc.io/doc/com.fasterxml.jackson.core/jackson-dataformat-xml/latest'
    }
}

scmVersion {
    tag {
        prefix = 'ical4j-serializer-'
    }
    versionCreator 'versionWithBranch'
    branchVersionCreator = ['main': 'simple']
    nextVersion {
        suffix = 'pre'
        separator = '-'
    }
}

group = 'org.ical4j'
description = 'Custom marshalling between iCal4j objects and JSON formats'
version = scmVersion.version

jar {
    manifest {
        attributes (
                'Implementation-Title': 'iCal4j Serializer',
                'Implementation-Version': version,
                'Implementation-Vendor': 'Ben Fortuna'
        )
    }
}

// Publishing to the Sonatype Central Portal is configured via the vanniktech plugin.
// Host, auto-release and signing toggles live in gradle.properties
// (SONATYPE_HOST, SONATYPE_AUTOMATIC_RELEASE, RELEASE_SIGNING_ENABLED).
// Credentials and the signing key are supplied via ORG_GRADLE_PROJECT_* env vars in CI.
mavenPublishing {
    coordinates(group.toString(), project.name, version.toString())

    pom {
        name = project.name
        description = project.description
        url = 'http://ical4j.github.io'

        licenses {
            license {
                name = 'iCal4j - License'
                url = 'https://raw.githubusercontent.com/ical4j/ical4j/master/LICENSE'
                distribution = 'repo'
            }
        }

        developers {
            developer {
                id = 'fortuna'
                name = 'Ben Fortuna'
            }
        }

        scm {
            url = 'https://github.com/ical4j/ical4j-serializer'
            connection = 'scm:git@github.com:ical4j/ical4j-serializer.git'
            developerConnection = 'scm:git@github.com:ical4j/ical4j-serializer.git'
        }
    }
}
