plugins {
    id 'groovy'
    id "biz.aQute.bnd.builder" version "7.1.0"
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'pl.allegro.tech.build.axion-release' version '1.13.6'
}

repositories {
    mavenCentral()
    mavenLocal()
    // sonatype snapshots
    maven {
        url 'https://central.sonatype.com/repository/maven-snapshots/'
    }
}

java {
    // bnd 7.x requires JDK 17 to run; Gradle's toolchain transparently provisions
    // a JDK 17 even when the build is launched with an older runtime.
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    sourceCompatibility = 11
    targetCompatibility = 11

    withJavadocJar()
    withSourcesJar()
}

dependencies {
    api libs.ical4j, libs.ical4j.vcard, libs.ical4j.extensions,
            libs.jackson.databind, libs.jackson.dataformat.xml

    implementation libs.j2html

    annotationProcessor 'org.osgi:osgi.core:8.0.0',
            'org.osgi:org.osgi.service.component.annotations:1.5.1',
            'org.osgi:org.osgi.service.metatype.annotations:1.4.1',
            'org.osgi:org.osgi.annotation:6.0.0'

    testImplementation libs.groovy

    testImplementation platform(libs.spock.bom), libs.spock.core, libs.log4j.core, libs.log4j.slf4j2


}

test {
    useJUnitPlatform()
}

javadoc {
    options {
        links 'https://docs.oracle.com/en/java/javase/11/docs/api/',
            'https://javadoc.io/doc/org.mnode.ical4j/ical4j/latest',
            'https://javadoc.io/doc/org.mnode.ical4j/ical4j-vcard/latest',
            'https://javadoc.io/doc/org.mnode.ical4j/ical4j-extensions/latest',
            'https://javadoc.io/doc/com.fasterxml.jackson.core/jackson-core/latest',
            'https://javadoc.io/doc/com.fasterxml.jackson.core/jackson-databind/latest',
            'https://javadoc.io/doc/com.fasterxml.jackson.core/jackson-dataformat-xml/latest'
    }
}

scmVersion {
    tag {
        prefix = 'ical4j-serializer-'
    }
    versionCreator 'versionWithBranch'
    branchVersionCreator = ['main': 'simple']
    nextVersion {
        suffix = 'pre'
        separator = '-'
    }
}

group = 'org.ical4j'
description = 'Custom marshalling between iCal4j objects and JSON formats'
version = scmVersion.version

jar {
    manifest {
        attributes (
                'Implementation-Title': 'iCal4j Serializer',
                'Implementation-Version': version,
                'Implementation-Vendor': 'Ben Fortuna'
        )
    }
}

ext {
    isReleaseVersion = !version.endsWith("SNAPSHOT")
}

publishing {
    publications {
        ical4j_serializer(MavenPublication) {
            from components.java
            pom.withXml {
                asNode().appendNode('name', project.name)
                asNode().appendNode('description', project.description)
                asNode().appendNode('url', 'http://ical4j.github.io')

                def scmNode = asNode().appendNode('scm')
                scmNode.appendNode('url', 'https://github.com/ical4j/ical4j-serializer')
                scmNode.appendNode('connection', 'scm:git@github.com:ical4j/ical4j-serializer.git')
                scmNode.appendNode('developerConnection', 'scm:git@github.com:ical4j/ical4j-serializer.git')

                def licenseNode = asNode().appendNode('licenses').appendNode('license')
                licenseNode.appendNode('name', 'iCal4j - License')
                licenseNode.appendNode('url', 'https://raw.githubusercontent.com/ical4j/ical4j/master/LICENSE')
                licenseNode.appendNode('distribution', 'repo')

                def developerNode = asNode().appendNode('developers').appendNode('developer')
                developerNode.appendNode('id', 'fortuna')
                developerNode.appendNode('name', 'Ben Fortuna')
            }
        }
    }

    repositories {
        maven {
            name = "MavenCentral"
            url = !isReleaseVersion ? "https://central.sonatype.com/repository/maven-snapshots/" : "https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/"
            credentials {
                username = System.getenv("MAVEN_USERNAME")
                password = System.getenv("MAVEN_PASSWORD")
            }
        }
//        maven {
//            name = "GitHubPackages"
//            url = uri("https://maven.pkg.github.com/ical4j/ical4j")
//            credentials {
//                username = System.getenv("GPR_USERNAME")
//                password = System.getenv("GPR_TOKEN")
//            }
//        }
    }
}

signing {
    required { isReleaseVersion }
    sign publishing.publications.ical4j_serializer
}
